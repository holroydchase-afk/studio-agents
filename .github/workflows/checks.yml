name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright for the ux-shots tests
        # Installed outside the checkout so the repo-wide greps in check.sh never scan node_modules.
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null && npm i playwright@1.63.0 && npx playwright install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Plugin, templates and scripts
        run: bash tests/check.sh
  supabase-starter:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Supabase starter migrations and RLS tests
        run: sh templates/supabase/tests/sql/run.sh
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check the starter's Edge Functions
        run: cd templates/supabase/supabase/functions && deno check --config deno.json */index.ts _shared/*.ts
