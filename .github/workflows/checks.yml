name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plugin, templates and scripts
        run: bash tests/check.sh
  supabase-starter:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Supabase starter migrations and RLS tests
        run: sh templates/supabase/tests/sql/run.sh
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check the starter's Edge Functions
        run: cd templates/supabase/supabase/functions && deno check --config deno.json */index.ts _shared/*.ts
