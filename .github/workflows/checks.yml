name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Playwright for the ux-shots tests
        # Installed outside the checkout so the repo-wide greps in check.sh never scan node_modules.
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null && npm i playwright@1.63.0 && npx playwright install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Plugin, templates and scripts
        run: bash tests/check.sh
  supabase-starter:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Supabase starter migrations and RLS tests
        run: sh templates/supabase/tests/sql/run.sh
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Type check the starter's Edge Functions
        run: cd templates/supabase/supabase/functions && deno check --config deno.json */index.ts _shared/*.ts
  lint-config:
    runs-on: ubuntu-latest
    env:
      LINT_REQUIRE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Install the studio lint dependencies
        run: cd templates/lint && npm ci
      - name: Studio ESLint config tests
        run: node --test tests/lint-config.test.mjs
      - name: Lint this repo with the studio config (strict: any finding fails)
        env:
          STUDIO_LINT_STRICT: '1'
        run: templates/lint/node_modules/.bin/eslint .
