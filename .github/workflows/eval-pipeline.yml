name: eval-pipeline
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Suites, frozen files, ledgers and stale runs
        run: node tools/eval-pipeline.mjs ci-check
  run-gated:
    runs-on: ubuntu-latest
    needs: ci-check
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Model run (skipped without a key)
        env:
          EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
        run: node tools/eval-pipeline.mjs run-gated
  evalpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: EvalPM demo and tests
        run: |
          node evalpm/evalpm.mjs demo
          node --test tests/evalpm.test.mjs
          node --test tests/evalpm-capture.test.mjs
