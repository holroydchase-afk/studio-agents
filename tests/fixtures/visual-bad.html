<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Engineer-built</title>
<!-- Passes every G rule but looks built without a designer: 10 type sizes, 4 families, 6 corner radii, a card inside a card. -->
<style>
body{font:17px/1.6 system-ui;margin:0;padding:0 16px;color:#16231D;background:#F7F6F1}
h1{font:700 34px Georgia,serif} h2{font:700 25px Arial,sans-serif} h3{font:600 19px Verdana,sans-serif}
.card{border:1px solid #DCDFD6;border-radius:14px;padding:16px;margin:12px 0;background:#fff;min-height:80px}
.inner{border:1px solid #DCDFD6;border-radius:10px;padding:12px;min-height:70px;background:#fff}
.btn{font:600 15px system-ui;padding:12px 16px;border-radius:6px;border:1px solid #DCDFD6;background:transparent;color:#16231D}
.primary{background:#1F5C44;color:#fff;border-radius:3px}
.chip{border-radius:5px;padding:4px 8px;font-size:13px;border:1px solid #DCDFD6}
.tag{border-radius:2px;padding:2px 6px;font-size:12px;border:1px solid #DCDFD6}
.s14{font-size:14px} .s16{font-size:16px} .s21{font-size:21px} .s18{font-size:18px}
</style></head><body>
<h1>Projects</h1>
<button class="btn primary" type="button">New project</button>
<div class="card" style="width:600px;max-width:100%;box-sizing:border-box"><h2>Building</h2>
  <div class="inner"><h3>Build Slate</h3><p class="s14">Tracker</p><span class="chip">Live</span> <span class="tag">v1</span></div>
</div>
<p class="s16">Two projects.</p><p class="s21">Next up</p><p class="s18">Roadmap</p>
</body></html>
