<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nine sizes</title>
<!-- One font family and no cards, but 9 font sizes, so only the V2 size check can flag it. A shadow-only card inside a bordered card is a V9. -->
<style>body{font:17px/1.6 system-ui;margin:0;padding:0 16px;color:#16231D;background:#F7F6F1}
.outer{border:1px solid #DCDFD6;padding:16px;width:600px;max-width:100%;box-sizing:border-box}
.shadow{box-shadow:0 2px 6px rgba(0,0,0,.2);padding:12px;min-height:70px}</style></head><body>
<h1 style="font-size:40px">Nine sizes</h1>
<p style="font-size:12px">a</p><p style="font-size:13px">b</p><p style="font-size:14px">c</p><p style="font-size:15px">d</p><p style="font-size:20px">e</p><p style="font-size:28px">f</p><p style="font-size:22px">g</p>
<div class="outer"><div class="shadow">Shadow card</div></div>
</body></html>
