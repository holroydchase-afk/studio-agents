name = "studio-inbox"
main = "src/worker.ts"
compatibility_date = "2026-11-26"

# Create the database with `wrangler d1 create studio-inbox`, then replace database_id below
# with the id it prints (see SETUP.md). The value here is a placeholder, not a real id.
[[d1_databases]]
binding = "DB"
database_name = "studio-inbox"
database_id = "00000000-0000-0000-0000-000000000000"

# The connector URL carries the bearer token in its path, so nothing may log requests.
[observability]
enabled = false

[observability.logs]
invocation_logs = false
