name: portfolio-drift
# Studio: when a merge to main touches files behind this product's portfolio page or demo
# (see .portfolio-watch.json), file an intake issue on the portfolio repo. Never fails the build.
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: holroydchase-afk/studio-agents/actions/portfolio-drift@047248036cca5c952f43afd89d61b67ba8adb585 # v1 studio-agents main at pin time
        with:
          token: ${{ secrets.PORTFOLIO_INTAKE_TOKEN }}
