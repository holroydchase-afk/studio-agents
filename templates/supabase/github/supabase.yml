# Supabase checks on every PR: migrations plus row-level security tests on a throwaway
# Postgres, and a type check of the Edge Functions. Copied by studio-agents scripts/add-supabase.sh.
name: supabase
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migrations and RLS tests
        run: sh tests/sql/run.sh
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check Edge Functions
        run: cd supabase/functions && deno check --config deno.json */index.ts
