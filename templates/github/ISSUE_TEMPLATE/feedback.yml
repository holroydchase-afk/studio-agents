name: Feedback
description: Tell us what happened. Issues here are public.
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Please do not include personal information (names, addresses, account details).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page
      description: Which page or screen was this on?
  - type: input
    id: product
    attributes:
      label: Product
  - type: dropdown
    id: severity
    attributes:
      label: Kind of feedback
      options:
        - bug
        - ux
        - idea
    validations:
      required: true
